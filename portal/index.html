<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美的业务管理</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: rgba(255,255,255,0.84);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --radius: 20px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,245,247,0.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid #e5e5ea;
    padding: 0 40px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-sub { font-size: 13px; color: var(--text-secondary); }
  .main { max-width: 1400px; margin: 0 auto; padding: 48px 40px; }
  .hero { text-align: center; margin-bottom: 56px; }
  .hero h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
  .hero p { font-size: 17px; color: var(--text-secondary); line-height: 1.6; }
  .cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 24px; }
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
    text-decoration: none;
    color: var(--text);
    transition: all 0.25s;
    display: flex; flex-direction: column;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }
  .card-icon { font-size: 40px; margin-bottom: 20px; }
  .card-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.3px; }
  .card-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; flex: 1; }
  .card-tag {
    display: inline-block; margin-top: 16px; padding: 4px 12px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: rgba(0,113,227,0.08); border-radius: 20px;
    align-self: flex-start;
  }
  .card.coming-soon { opacity: 0.5; pointer-events: none; }
  .card.coming-soon .card-tag { color: #8e8e93; background: rgba(142,142,147,0.12); }
  .footer { text-align: center; margin-top: 64px; padding: 24px; color: var(--text-secondary); font-size: 12px; }

  @media (max-width: 1200px) {
    .cards { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-width: 768px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .main { padding: 32px 20px; }
    .hero h1 { font-size: 28px; }
  }
  @media (max-width: 500px) {
    .cards { grid-template-columns: 1fr; }
    .nav { padding: 0 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <img src="cosco.png" alt="COSCO" style="height:36px">
  <span class="nav-sub">Midea Business Portal</span>
</nav>

<div class="main">
  <div class="hero">
    <h1>美的业务管理系统</h1>
    <p>统一入口，高效协作</p>
  </div>

  <div class="cards">

    <a href="https://board.cleverguo.cn" class="card">
      <div class="card-icon">📊</div>
      <div class="card-title">项目客服看板</div>
      <div class="card-desc">海关申报日报、异常跟进、数据分析。支持 2025/2026 年度数据实时查询与闭环管理。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="https://ship.cleverguo.cn" class="card">
      <div class="card-icon">📋</div>
      <div class="card-title">美的跟单功能模块</div>
      <div class="card-desc">出口跟单、台账管理、制单跟踪。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="/billing" class="card">
      <div class="card-icon">🧾</div>
      <div class="card-title">账单制作</div>
      <div class="card-desc">制作每月账单，自动匹配报价、计算费用。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="/weekly" class="card">
      <div class="card-icon">📝</div>
      <div class="card-title">产品部周报系统</div>
      <div class="card-desc">AI 智能生成周报、工作重点追踪、部门全局分析与个人评估。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="/cangdan" class="card">
      <div class="card-icon">📦</div>
      <div class="card-title">舱单自动生成</div>
      <div class="card-desc">上传报关资料，一键生成舱单复核件。支持批量压缩包和多格式文件。</div>
      <span class="card-tag">已上线</span>
    </a>

  </div>

  <div class="footer">© 2026 远海通全球智能关务平台</div>
</div>

</body>
</html>
