<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美的业务管理</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: rgba(255,255,255,0.84);
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --accent: #0071e3;
    --radius: 20px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Nav */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,245,247,0.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid #e5e5ea;
    padding: 0 40px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .nav-sub { font-size: 13px; color: var(--text-secondary); }

  .main { max-width: 1200px; margin: 0 auto; padding: 48px 40px; }

  /* Hero */
  .hero { text-align: center; margin-bottom: 56px; }
  .hero h1 { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 12px; }
  .hero p { font-size: 17px; color: var(--text-secondary); line-height: 1.6; }

  /* Cards Grid */
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius);
    padding: 32px 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(255,255,255,0.6);
    text-decoration: none;
    color: var(--text);
    transition: all 0.25s;
    display: flex; flex-direction: column;
    cursor: pointer;
    height: 100%;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1); }

  .card-icon { font-size: 40px; margin-bottom: 20px; }
  .card-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.3px; }
  .card-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.6; }
  .card-tag {
    display: inline-block; margin-top: 16px; padding: 4px 12px;
    font-size: 11px; font-weight: 600; color: var(--accent);
    background: rgba(0,113,227,0.08); border-radius: 20px;
  }
  .card.coming-soon { opacity: 0.5; pointer-events: none; }
  .card.coming-soon .card-tag { color: #8e8e93; background: rgba(142,142,147,0.12); }

  /* Footer */
  .footer { text-align: center; margin-top: 64px; padding: 24px; color: var(--text-secondary); font-size: 12px; }

  @media (max-width: 768px) {
    .nav { padding: 0 20px; }
    .main { padding: 32px 20px; }
    .hero h1 { font-size: 28px; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<nav class="nav">
  <img src="cosco.png" alt="COSCO" style="height:36px">
  <span class="nav-sub">Midea Business Portal</span>
</nav>

<div class="main">
  <div class="hero">
    <h1>美的业务管理系统</h1>
    <p>统一入口，高效协作</p>
  </div>

  <div class="cards">

    <!-- 关务看板 -->
    <a href="https://board.cleverguo.cn" class="card">
      <div class="card-icon">📊</div>
      <div class="card-title">业务看板</div>
      <div class="card-desc">海关申报日报、异常跟进、数据分析。支持 2025/2026 年度数据实时查询与闭环管理。</div>
      <span class="card-tag">已上线</span>
    </a>

    <!-- 大船排期 -->
    <a href="https://ship.cleverguo.cn" class="card">
      <div class="card-icon">🚢</div>
      <div class="card-title">大船排期计划</div>
      <div class="card-desc">出口排船、台账管理。</div>
      <span class="card-tag">已上线</span>
    </a>

    <!-- 建设中 -->
    <div class="card coming-soon">
      <div class="card-icon">🔧</div>
      <div class="card-title">建设中</div>
      <div class="card-desc">更多功能即将推出，敬请期待。</div>
      <span class="card-tag">建设中</span>
    </div>

  </div>

  <div class="footer">© 2026 远海通全球智能关务平台</div>
</div>

</body>
</html>
