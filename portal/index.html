<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美的业务管理</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --text: #1d1d1f;
    --text-secondary: rgba(0,0,0,0.8);
    --text-tertiary: rgba(0,0,0,0.48);
    --accent: #0071e3;
    --link: #0066cc;
    --nav-bg: rgba(0,0,0,0.8);
    --shadow-card: rgba(0,0,0,0.22) 3px 5px 30px 0px;
    --font-display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    --font-text: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    --font-mono: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-text);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── Navigation ── */
  .nav {
    position: sticky; top: 0; z-index: 100;
    height: 48px;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    display: flex; align-items: center; justify-content: center;
    padding: 0 40px;
  }
  .nav-inner {
    max-width: 980px; width: 100%;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand {
    display: flex; align-items: center; gap: 10px;
    color: #ffffff; font-size: 14px; font-weight: 500;
    letter-spacing: -0.2px; text-decoration: none;
  }
  .nav-brand img { height: 24px; }
  .nav-sub { font-size: 12px; color: rgba(255,255,255,0.64); font-weight: 400; }

  /* ── Main ── */
  .main { max-width: 980px; margin: 0 auto; padding: 80px 40px 64px; }

  /* ── Hero ── */
  .hero { text-align: center; margin-bottom: 72px; }
  .hero h1 {
    font-family: var(--font-display);
    font-size: 56px; font-weight: 600;
    line-height: 1.07; letter-spacing: -0.28px;
    color: var(--text); margin-bottom: 16px;
  }
  .hero p {
    font-family: var(--font-display);
    font-size: 21px; font-weight: 400;
    line-height: 1.19; letter-spacing: 0.231px;
    color: var(--text-secondary);
  }

  /* ── Cards Grid ── */
  .cards {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;
    align-items: stretch;
  }
  .card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 32px 28px 28px;
    box-shadow: var(--shadow-card);
    text-decoration: none;
    color: var(--text);
    transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    display: flex; flex-direction: column;
    cursor: pointer;
  }
  .card:hover { transform: translateY(-2px); }
  .card-icon { font-size: 36px; margin-bottom: 20px; line-height: 1; }
  .card-title {
    font-family: var(--font-display);
    font-size: 21px; font-weight: 700;
    line-height: 1.19; letter-spacing: 0.231px;
    margin-bottom: 8px;
  }
  .card-desc {
    font-size: 14px; font-weight: 400;
    line-height: 1.43; letter-spacing: -0.224px;
    color: var(--text-secondary);
    flex: 1; margin-bottom: 20px;
  }
  .card-tag {
    display: inline-block;
    padding: 4px 14px;
    font-size: 11px; font-weight: 600; color: var(--link);
    background: rgba(0,113,227,0.06); border-radius: 980px;
    align-self: flex-start;
  }
  .card.coming-soon { opacity: 0.4; pointer-events: none; }
  .card.coming-soon .card-tag { color: var(--text-tertiary); background: rgba(0,0,0,0.04); }

  /* ── Footer ── */
  .footer {
    text-align: center; margin-top: 64px; padding: 24px;
    color: var(--text-tertiary); font-size: 12px;
    letter-spacing: -0.12px; line-height: 1.33;
  }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 834px) {
    .hero h1 { font-size: 40px; }
    .hero p { font-size: 19px; }
    .cards { grid-template-columns: 1fr; max-width: 480px; margin: 0 auto; }
    .main { padding: 56px 24px 48px; }
    .nav { padding: 0 20px; }
  }
  @media (max-width: 480px) {
    .hero h1 { font-size: 28px; line-height: 1.14; }
    .hero p { font-size: 17px; }
    .hero { margin-bottom: 48px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="nav-brand" href="https://cleverguo.cn">
      <span>远海通</span>
    </a>
    <span class="nav-sub">Midea Business Portal</span>
  </div>
</nav>

<div class="main">
  <div class="hero">
    <h1>美的业务管理系统</h1>
    <p>统一入口，高效协作</p>
  </div>

  <div class="cards">

    <a href="https://board.cleverguo.cn" class="card">
      <div class="card-icon">📊</div>
      <div class="card-title">项目客服看板</div>
      <div class="card-desc">海关申报日报、异常跟进、数据分析。支持 2025/2026 年度数据实时查询与闭环管理。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="https://ship.cleverguo.cn" class="card">
      <div class="card-icon">📋</div>
      <div class="card-title">美的跟单功能模块</div>
      <div class="card-desc">出口跟单、台账管理、制单跟踪。</div>
      <span class="card-tag">已上线</span>
    </a>

    <a href="/billing" class="card">
      <div class="card-icon">📋</div>
      <div class="card-title">账单制作</div>
      <div class="card-desc">制作每月账单，自动匹配报价、计算费用。</div>
      <span class="card-tag">已上线</span>
    </a>

  </div>

  <div class="footer">© 2026 远海通全球智能关务平台</div>
</div>

</body>
</html>
